# =============================================================================
# APS-CLIF Data Requirements
# =============================================================================
# This file defines all required CLIF tables, columns, and category values
# needed to support the APS (Acute Physiology Score) data collection.
#
# Based on APS-CLIF Crosswalk analysis.
# =============================================================================

# =============================================================================
# PATIENT TABLE (Full table required)
# =============================================================================
patient_required_columns:
  - patient_id
  - birth_date
  - death_dttm
  - race_category
  - ethnicity_category
  - sex_category
  - language_category

# =============================================================================
# HOSPITALIZATION TABLE (Full table required)
# =============================================================================
hospitalization_required_columns:
  - patient_id
  - hospitalization_id
  - admission_dttm
  - discharge_dttm
  - age_at_admission
  - admission_type_category
  - discharge_category

# =============================================================================
# ADT TABLE (Full table required)
# =============================================================================
adt_required_columns:
  - hospitalization_id
  - hospital_id
  - hospital_type
  - in_dttm
  - out_dttm
  - location_name
  - location_category
  - location_type

adt_location_categories_of_interest:
  - ed
  - ward
  - stepdown
  - icu
  - procedural
  - other

# =============================================================================
# VITALS TABLE
# =============================================================================
vitals_required_columns:
  - hospitalization_id
  - recorded_dttm
  - vital_category
  - vital_value
  - meas_site_name

vitals_of_interest:
  - temp_c
  - heart_rate
  - sbp
  - dbp
  - map
  - spo2
  - respiratory_rate
  - weight_kg
  - height_cm

# =============================================================================
# LABS TABLE
# =============================================================================
labs_required_columns:
  - hospitalization_id
  - lab_result_dttm
  - lab_category
  - lab_value
  - lab_value_numeric

labs_of_interest:
  # ABG values
  - po2_arterial
  - pco2_arterial
  - ph_arterial
  - ph_venous
  - so2_arterial
  # Electrolytes
  - sodium
  - potassium
  - chloride
  - bicarbonate
  - calcium_total
  - magnesium
  # Renal
  - creatinine
  - bun
  # Metabolic
  - glucose_serum
  - lactate
  - albumin
  # Hematology
  - wbc
  - hemoglobin
  - platelet_count
  - neutrophils_absolute
  - lymphocytes_absolute
  # Liver
  - bilirubin_total
  - ast
  - alt
  # Coagulation
  - inr
  - ptt
  # Inflammatory markers
  - crp
  - procalcitonin
  - ferritin
  # Cardiac
  - troponin_i
  - troponin_t

# Labs NOT in CLIF (documented gaps)
labs_not_in_clif:
  - hematocrit
  - d_dimer
  - fibrinogen

