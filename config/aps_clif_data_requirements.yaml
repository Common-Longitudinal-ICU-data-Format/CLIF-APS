# =============================================================================
# DOCUMENTED GAPS - Elements NOT available in CLIF
# =============================================================================
elements_not_in_clif:
  medications:
    statins: No statin medications in schema
    oral_anticoagulants: apixaban, rivaroxaban, dabigatran, edoxaban, warfarin
    oral_hypoglycemics: metformin, glipizide, etc.
    glp1_agonists: semaglutide, dulaglutide, liraglutide
    antidepressants: No antidepressant medications in schema
    enoxaparin: Subcutaneous LMWH not in schema
    oral_antiplatelets: aspirin, clopidogrel, prasugrel, ticagrelor
    most_immunosuppressants: Most biologics, chemotherapy agents not in schema
  labs:
    hematocrit: Not in CLIF
    d_dimer: Not in CLIF
    fibrinogen: Not in CLIF
  microbiology:
    respiratory_viral_panel: Only SARS-CoV-2 and RSV available
    stool_viral_pathogens: Rotavirus, norovirus, etc. not in schema
    parasites: Giardia, cryptosporidium, etc. not in schema
    shigella_dysenteriae: Only shigella_sonnei in schema
  other:
    nutrition: Nutrition administration not in CLIF
    fluid_balance: Intake/output not in CLIF
    procedures: Surgical procedures not in provided schemas
    blood_products: PRBCs, platelets, FFP, cryo not in schema
    nbbal_volumes: Procedure-specific volumes not in CLIF

