[project]
name = "clif-aps"
version = "0.1.0"
description = "A pipeline to extract and transform CLIF data for patients enrolled in APS clinical trials"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clifpy>=2.1.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "plotly>=5.24.0",
    "pyyaml>=6.0.1",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]
